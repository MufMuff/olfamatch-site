# Réglages du programme Cloudflare (Worker) d'Olfamatch. Mode d'emploi : LISEZMOI.md.
name = "olfamatch-atelier"
main = "index.js"
compatibility_date = "2026-10-01"

# Envoi d'e-mails (Cloudflare Email Routing). L'adresse doit être vérifiée dans Email Routing.
[[send_email]]
name = "EMAIL"
destination_address = "ADRESSE-DE-L-ATELIER@exemple.fr"

# Mémoire (KV) : commandes Stripe déjà traitées, descriptions déjà écrites, compteur d'appels à l'IA.
# Créer une fois avec « npx wrangler kv namespace create MEMOIRE », puis coller l'identifiant affiché.
[[kv_namespaces]]
binding = "MEMOIRE"
id = "IDENTIFIANT-KV-A-REMPLACER"

# Limite d'appels à la description par IA : 5 par minute et par adresse IP (Wrangler 4.36 ou plus).
# namespace_id : un nombre au choix, unique dans ton compte Cloudflare.
[[ratelimits]]
name = "LIMITE_IA"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

[vars]
# Adresse principale du site (lien vers la page de fabrication dans les e-mails).
SITE_ORIGIN = "https://olfamatch.pages.dev"
# Toutes les adresses du site autorisées à demander une description, séparées par des virgules.
# Le jour où le nom de domaine arrive : "https://olfamatch.pages.dev,https://olfamatch.fr,https://www.olfamatch.fr"
SITE_ORIGINS = "https://olfamatch.pages.dev"
# Adresse qui reçoit les fiches de pesée (la même que destination_address ci-dessus).
EMAIL_ATELIER = "ADRESSE-DE-L-ATELIER@exemple.fr"
# Adresse d'envoi : elle doit appartenir au nom de domaine où Email Routing est activé.
EMAIL_EXPEDITEUR = "atelier@VOTRE-DOMAINE.fr"
# Nombre maximum d'appels à l'IA par jour, tous visiteurs confondus.
IA_PLAFOND_JOUR = "200"
# Facultatif : autre modèle d'IA pour les descriptions (par défaut claude-haiku-5-5, le moins cher).
# MODELE_IA = "claude-sonnet-5-5"

# Secrets : JAMAIS dans ce fichier. À enregistrer une fois avec :
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put ANTHROPIC_API_KEY
