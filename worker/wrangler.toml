# Réglages du programme Cloudflare (Worker) d'Olfamatch « Crée ton parfum ». Mode d'emploi : LISEZMOI.md.
name = "olfamatch-atelier"
main = "index.js"
compatibility_date = "2026-10-01"

# Base de données (D1) : formules, commandes, notifications Stripe, lots, stocks.
# Créer une fois avec « npx wrangler d1 create olfamatch », coller l'identifiant affiché,
# puis créer les tables avec « npx wrangler d1 execute olfamatch --remote --file=schema.sql ».
[[d1_databases]]
binding = "DB"
database_name = "olfamatch"
database_id = "IDENTIFIANT-D1-A-REMPLACER"

# Envoi d'e-mails (Cloudflare Email Service) : à l'atelier et aux clients.
# Il faut d'abord activer l'envoi sur ton nom de domaine : « npx wrangler email sending enable TON-DOMAINE.fr ».
[[send_email]]
name = "EMAIL"

# Mémoire (KV) : descriptions écrites par l'IA (30 jours) et compteur d'appels du jour.
# Créer une fois avec « npx wrangler kv namespace create MEMOIRE », puis coller l'identifiant affiché.
[[kv_namespaces]]
binding = "MEMOIRE"
id = "IDENTIFIANT-KV-A-REMPLACER"

# Limites de demandes par adresse IP (Wrangler 4.36 ou plus). namespace_id : un nombre au choix, unique dans ton compte.
# Toutes les adresses /api/ : 30 demandes par minute.
[[ratelimits]]
name = "LIMITE_API"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60

# Appels à l'IA : 5 par minute.
[[ratelimits]]
name = "LIMITE_IA"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

[vars]
# Adresse principale du site (pages de retour après paiement, lien vers la fiche dans les e-mails).
SITE_ORIGIN = "https://olfamatch.pages.dev"
# Toutes les adresses du site autorisées à appeler le programme, séparées par des virgules.
# Le jour où le nom de domaine arrive : "https://olfamatch.pages.dev,https://olfamatch.fr,https://www.olfamatch.fr"
SITE_ORIGINS = "https://olfamatch.pages.dev"
# Adresse qui reçoit les commandes et les alertes.
EMAIL_ATELIER = "ADRESSE-DE-L-ATELIER@exemple.fr"
# Adresse d'envoi : elle doit appartenir au nom de domaine activé dans Email Service.
EMAIL_EXPEDITEUR = "atelier@VOTRE-DOMAINE.fr"
# Atelier privé (/fabrication) : Cloudflare Access. Nom de l'équipe Access (xxx.cloudflareaccess.com),
# identifiant « Application Audience (AUD) » de l'application Access, et adresses e-mail autorisées.
ACCESS_EQUIPE = "NOM-EQUIPE-ACCESS"
ACCESS_AUD = "AUD-A-REMPLACER"
ACCESS_EMAILS = "ADRESSE-D-ETHAN@exemple.fr"
# Porte « Pars d'un parfum que tu aimes » : "true" seulement si config/features.json dit aussi true.
INSPIRATION_NOMMEE = "false"
# Nombre maximum d'appels à l'IA par jour, tous visiteurs confondus.
IA_PLAFOND_JOUR = "200"
# Facultatif : autre modèle d'IA (par défaut claude-haiku-5-5, le moins cher).
# MODELE_IA = "claude-sonnet-5-5"

# Secrets : JAMAIS dans ce fichier. À enregistrer une fois avec :
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put ANTHROPIC_API_KEY
